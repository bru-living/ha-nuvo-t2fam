name: Bug report
description: Report a problem with the NuVo NV-T2FAM integration
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: dropdown
    id: connection_type
    attributes:
      label: Connection type
      options:
        - TCP serial bridge
        - Local serial device
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and public addresses before pasting logs.
      render: text

