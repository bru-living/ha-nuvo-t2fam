name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master


  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/nuvo_t2fam/manifest.json > /dev/null
          python -m json.tool custom_components/nuvo_t2fam/strings.json > /dev/null
          python -m json.tool custom_components/nuvo_t2fam/translations/en.json > /dev/null
      - name: Run protocol tests
        run: python -m pytest -q --asyncio-mode=auto
