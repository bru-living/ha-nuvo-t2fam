name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/nuvo_t2fam/manifest.json > /dev/null
          python -m json.tool custom_components/nuvo_t2fam/strings.json > /dev/null
          python -m json.tool custom_components/nuvo_t2fam/translations/en.json > /dev/null

      - name: Build manual-install archive
        run: zip -r "nuvo_t2fam-${GITHUB_REF_NAME}.zip" custom_components README.md LICENSE CHANGELOG.md hacs.json docs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "nuvo_t2fam-${GITHUB_REF_NAME}.zip" --generate-notes --title "${GITHUB_REF_NAME}"

